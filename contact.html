<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register & Contact — MIMUN 2026</title>
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand">MIMUN<span>.</span></a>
      <button class="nav-toggle" id="navToggle"><span class="hamburger"></span></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="committees.html">Committees</a></li>
        <li><a href="secretariat.html">Secretariat</a></li>
        <li><a href="schedule.html">Schedule</a></li>
        <li><a href="contact.html" class="active btn-primary">Register</a></li>
      </ul>
    </div>
  </nav>

  <header class="page-header">
    <div class="container">
      <h1>REGISTER FOR MIMUN</h1>
      <p>Secure your position as a delegate or delegation leader.</p>
    </div>
  </header>

  <section class="container page-content">
    <div class="form-container">
      <form id="regForm" onsubmit="event.preventDefault(); alert('Registration submitted!');">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" required placeholder="John Doe">
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="john@example.com">
        </div>

        <div class="form-group">
          <label for="institution">School / University</label>
          <input type="text" id="institution" required placeholder="International Academy">
        </div>

        <div class="form-group">
          <label for="committee">Preferred Committee</label>
          <select id="committee">
            <option>UNGA - DISEC</option>
            <option>UNSC - Security Council</option>
            <option>UNHRC - Human Rights</option>
            <option>UN Women</option>
            <option>Historical Crisis Committee</option>
            <option>International Press</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Experience / Additional Remarks</label>
          <textarea id="message" rows="4" placeholder="Mention previous MUN experience..."></textarea>
        </div>

        <button type="submit" class="btn-hero-primary" style="border:none; cursor:pointer;">Submit Registration</button>
      </form>
    </div>
  </section>

  <footer>
    <div class="container footer-content">
      <p>&copy; 2026 MIMUN. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
